name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC (~11am Malaysia time)
  workflow_dispatch: {}    # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase table
        run: |
          curl -s -o /dev/null -w "Supabase responded: %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/app_state?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
